name: Ascend Communications
description: 'Ascend Communications, Inc. was an Alameda, California manufacturer of wide area networking
  equipment, founded in 1988 and taken public in 1994. It developed, manufactured and sold WAN access
  solutions — remote-access concentrators, ISDN and frame relay gear, and the MAX family of access
  servers — to telecommunications carriers, Internet service providers and corporate customers
  worldwide, becoming a leading supplier during the dial-up internet build-out of the 1990s. On January
  13, 1999 Lucent Technologies announced a definitive agreement to merge with Ascend in a stock deal
  valued at roughly $20.3 billion, and the merger completed on June 24, 1999, when Ascend became a
  wholly owned subsidiary of Lucent. The company has not operated independently since. It was surfaced
  in the API Evangelist network as a Kleiner Perkins portfolio company; it predates the public web API
  era and publishes no developer surface today.'
